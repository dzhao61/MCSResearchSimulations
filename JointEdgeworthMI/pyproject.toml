[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-edgeworth-mi"
version = "0.1.0"
description = "Joint studentized Edgeworth inference for differential MI"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]
