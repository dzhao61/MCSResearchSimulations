[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-cmi"
version = "0.1.0"
description = "Falsification-first validation of exact-cumulant sparse binary CMI tests"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
jidt = ["JPype1>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]
